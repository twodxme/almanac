<?xml version="1.0" encoding="UTF-8"?>
<!--
  Almanac's app icon.

  The motif is the one the app already draws everywhere else: a listing — a
  card carrying rows of entries with one of them picked out in the accent.
  It is the shape of the package table, of a marketplace card's text block,
  and of the miniature desktop drawn for a theme preview, so the icon is the
  product's own vocabulary rather than a borrowed metaphor.

  Two sheets behind the front one make it a catalogue rather than a single
  document: many things, gathered.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#232833"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78b4ff"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.6"
                    flood-color="#0b0e14" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Ground -->
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#ground)"/>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Two sheets behind: a catalogue, not a page -->
  <rect x="33" y="24" width="62" height="78" rx="9"
        fill="#9aa6bd" fill-opacity="0.34"/>
  <rect x="29.5" y="28" width="69" height="78" rx="9.5"
        fill="#c3cddf" fill-opacity="0.55"/>

  <!-- The listing itself -->
  <g filter="url(#lift)">
    <rect x="26" y="32" width="76" height="78" rx="10" fill="url(#sheet)"/>
  </g>

  <!-- Entries. The accent row is the one that needs you. -->
  <g>
    <rect x="36" y="45"   width="42" height="6.5" rx="3.25" fill="#2b3240"/>
    <rect x="36" y="58"   width="56" height="5.5" rx="2.75" fill="#aab4c6"/>
    <rect x="36" y="69.5" width="48" height="5.5" rx="2.75" fill="#aab4c6"/>
    <rect x="36" y="81"   width="34" height="6.5" rx="3.25" fill="url(#accent)"/>
    <rect x="36" y="93.5" width="52" height="5.5" rx="2.75" fill="#c6cedc"/>
  </g>
</svg>
