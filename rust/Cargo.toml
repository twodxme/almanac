[package]
name = "almanac"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "One window for everything installed on this machine"
license = "MIT"
repository = "https://github.com/twodxme/almanac"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "almanac-rs"
path = "src/main.rs"

[[bin]]
name = "almanac-parity"
path = "src/bin/almanac-parity.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
chrono = "0.4.45"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
glob = "0.3.4"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
hex = "0.4.3"
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
tempfile = "3.27.0"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"

[features]
# One per module: build with the work-in-progress copy (ARCHITECTURE.md).
wip-agents = []
wip-ai = []
wip-appimage = []
wip-autorun = []
wip-autostart = []
wip-autoupdate = []
wip-demo = []
wip-featured = []
wip-ghcache = []
wip-guard = []
wip-history = []
wip-i18n = []
wip-icons = []
wip-inventory = []
wip-maintenance = []
wip-mimeguard = []
wip-patches = []
wip-picks = []
wip-plugin-setup = []
wip-plugins = []
wip-security = []
wip-selfupdate = []
wip-services = []
wip-settings = []
wip-shortcuts = []
wip-snapshots = []
wip-sources = []
wip-store = []
wip-tasks = []
wip-themeart = []
wip-theming = []
wip-verify = []
wip-watcher = []
wip-xdg = []
wip-ui-shell = []
wip-ui-packages = []
wip-ui-store = []
wip-ui-store-actions = []
wip-ui-plugins = []
wip-ui-switchboard = []
wip-ui-history = []
wip-ui-ai = []
wip-ui-preferences = []
wip-ui-today = []
wip-ui-actions = []

[profile.release]
lto = "thin"
