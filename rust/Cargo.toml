[package]
name = "almanac"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "One window for everything installed on this machine"
license = "MIT"
repository = "https://github.com/twodxme/almanac"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "almanac-rs"
path = "src/main.rs"

[[bin]]
name = "almanac-parity"
path = "src/bin/almanac-parity.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
cairo-rs = { version = "0.22.9", features = ["png"] }
chrono = "0.4.45"
close_fds = "0.3.2"
encoding_rs = "0.8.35"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gio-unix = "0.22.8"
glib-unix = "0.22.8"
glob = "0.3.4"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
hex = "0.4.3"
indexmap = "2.14.2"
libc = "0.2.191"
nix = { version = "0.30.1", default-features = false, features = ["process", "signal", "user"] }
num-bigint = "0.5.1"
openssl = "0.10.75"
openssl-sys = "0.9.117"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["fs", "process", "system", "termios"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
tempfile = "3.27.0"
toml = "1.1.8"
toml_v10 = { version = "0.8", package = "toml" }
ureq = { version = "3.4.2", features = ["json", "rustls"], default-features = false }
url = "2.5.8"

[profile.release]
lto = "thin"
