# Every push and pull request, on a clean Arch Linux: the build, the tests,
# the desktop and AppStream metadata, and a real package build of this
# commit.
#
# Everything runs as an ordinary user with what an Arch desktop gives one:
# an 8 MiB stack, an English UTF-8 locale, the packages' translations. Root
# reads files whose mode forbids it, and some tests pin how deep nested input
# gets before the stack would run out.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # The image keeps no translations or locale data (NoExtract), and
          # the i18n tests read the system's catalogs: keep them, and put
          # back what the image stripped from the packages already there.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            base-devel git rust gtk4 libadwaita openssl pacman-contrib polkit \
            xdg-utils appstream desktop-file-utils gettext
          pacman -Qqn | pacman -S --noconfirm -
          echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen
          locale-gen
          useradd -m user
          # `as-user cmd...`: run as that user, 8 MiB stack, en_US.UTF-8.
          printf '%s\n' '#!/bin/sh' \
            'exec sudo -u user -H env LANG=en_US.UTF-8 sh -c '"'"'ulimit -Ss 8192 && exec "$@"'"'"' sh "$@"' \
            > /usr/local/bin/as-user
          chmod +x /usr/local/bin/as-user

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # pkgver counts commits

      - name: Build
        run: |
          chown -R user "$GITHUB_WORKSPACE"
          as-user cargo build --release --locked

      - name: Tests
        run: |
          # GTK needs a display; Broadway is one with no screen.
          as-user sh -c 'gtk4-broadwayd :5 & b=$!; sleep 1
            GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 cargo test --locked
            rc=$?; kill $b; exit $rc'

      - name: Metadata
        run: |
          appstreamcli validate --no-net docs/io.github.twodxme.Almanac.metainfo.xml
          desktop-file-validate docs/almanac.desktop

      - name: Package builds
        run: |
          mkdir /tmp/pkg && cp PKGBUILD /tmp/pkg/ && chown -R user /tmp/pkg
          # Build this commit, not whatever main is on GitHub right now.
          sed -i "s|^source=.*|source=(\"git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" /tmp/pkg/PKGBUILD
          cd /tmp/pkg
          as-user git config --global --add safe.directory '*'
          # check() runs the tests again, inside the package build.
          as-user sh -c 'gtk4-broadwayd :7 & b=$!; sleep 1
            GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 makepkg --nodeps --noconfirm
            rc=$?; kill $b; exit $rc'
          # (makepkg also makes an almanac-git-debug package here)
          tar -tf almanac-git-[0-9]*.pkg.tar.zst | grep -q usr/bin/almanac
