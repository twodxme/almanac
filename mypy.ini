# Type checking, run in CI. Most of Almanac predates annotations, so the
# baseline is check_untyped_defs: function bodies are checked even where the
# signature is not annotated, which is where mistakes like calling .group()
# on a failed regex match or treating a maybe-None path as a string live.
[mypy]
python_version = 3.11
files = .
# The tests call window methods on a lightweight stub on purpose (a real
# window needs a display); they are checked by running, not by mypy.
exclude = (?x)(^test_app\.py$ | ^packaging/ | ^build/)
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# PyGObject ships no type information; GTK and libadwaita are untyped.
[mypy-gi.*]
ignore_missing_imports = True
